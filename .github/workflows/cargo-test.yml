name: Run Cargo Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: ParticleChromo3D_rust

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: ['stable', 'beta']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Rust ${{ matrix.rust-version }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust-version }}

    - name: Cache cargo registry and build output
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ParticleChromo3D_rust/target
        key: ${{ runner.os }}-cargo-${{ matrix.rust-version }}-${{ hashFiles('ParticleChromo3D_rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust-version }}-

    - name: Build
      run: cargo build --verbose

    - name: Run cargo test
      run: cargo test --verbose

    - name: Build library without CLI features
      run: cargo build --no-default-features --verbose

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Rust stable with rustfmt and clippy
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry and build output
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ParticleChromo3D_rust/target
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('ParticleChromo3D_rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-lint-

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run clippy on just the library
      run: cargo clippy --all-targets --no-default-features -- -D warnings
